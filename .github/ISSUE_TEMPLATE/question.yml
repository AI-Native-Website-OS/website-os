name: ❓ Question
description: 使用疑问、配置问题、技术咨询
title: "[Question] "
labels: ["question"]
body:
  - type: textarea
    id: scene
    attributes:
      label: 使用场景
      placeholder: 你正在做什么操作
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 自己已经尝试过的排查方法
  - type: textarea
    id: ask
    attributes:
      label: 明确你的问题
      placeholder: 描述你需要哪方面帮助
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境与版本
      placeholder: 系统、项目版本、依赖版本
