server:
  # 监听地址：由 BACKEND_HOST 控制（0.0.0.0=所有网卡）
  address: ${BACKEND_HOST:0.0.0.0}
  port: ${BACKEND_PORT:8080}
  servlet:
    context-path: /api
  # 容器级转发头解析策略：固定 NONE（不信任任何 X-Forwarded-*，防伪造）。
  # 客户端 IP 由 ClientIpResolver 从 X-Real-IP 头解析（缺失时回退直连来源），不受此值影响。
  forward-headers-strategy: none

spring:
  application:
    name: ${SPRING_APPLICATION_NAME}
  datasource:
    driver-class-name: org.postgresql.Driver
    # 默认由 PG_* 推导（PG_SERVICE_URL）；特殊场景可用 SPRING_DATASOURCE_* 单独覆盖
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE:sinounion}}
    username: ${SPRING_DATASOURCE_USERNAME:${PG_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PG_PASSWORD}}
    hikari:
      max-lifetime: 600000
      connection-timeout: 30000
      idle-timeout: 300000
      validation-timeout: 5000
      connection-test-query: SELECT 1
      minimum-idle: 5
      maximum-pool-size: 20
  redis:
    # 默认由 REDIS_* 推导（REDIS_SERVICE_URL）；特殊场景可用 SPRING_REDIS_* 单独覆盖
    host: ${SPRING_REDIS_HOST:${REDIS_HOST:localhost}}
    port: ${SPRING_REDIS_PORT:${REDIS_PORT:6379}}
    username: ${SPRING_REDIS_USERNAME:${REDIS_USER:}}
    password: ${SPRING_REDIS_PASSWORD:${REDIS_PASSWORD:}}
    database: ${SPRING_REDIS_DATABASE:${REDIS_DATABASE:0}}
  servlet:
    multipart:
      # 上传大小限制（与文档上传上限一致：20MB）
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sinounion.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  # access token 有效期，单位为毫秒（JwtUtils 中 new Date(now + expiration)）；默认 24 小时
  expiration: 86400000
  # refresh token 有效期，单位为毫秒；默认 7 天
  refresh-expiration: 604800000

# 文件上传配置
upload:
  path: ${UPLOAD_PATH}
  # 允许上传的 MIME 类型（固定值）
  allowed-types: image/png,image/jpeg,image/webp,image/gif,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown

# 敏感配置加密（短信 Secret / 模型 API Key 等）：传输用 RSA、落盘用 AES
# CONFIG_CRYPTO_AES_KEY 为 Base64 编码的 32 字节密钥；未配置时启动自动生成并写入 .env
config-crypto:
  aes-key: ${CONFIG_CRYPTO_AES_KEY:}

# SpringDoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# AI服务配置（知识库同步）
ai:
  service:
    # 默认由 PYTHON_HOST/PYTHON_PORT 推导（PYTHON_SERVICE_URL）；特殊场景可用 PYTHON_SERVICE_URL 显式覆盖
    url: ${PYTHON_SERVICE_URL:http://${PYTHON_HOST:localhost}:${PYTHON_PORT:8000}}
    memories-dir: ${AI_SERVICE_MEMORIES_DIR}

# SEO文件路径（相对于工作目录或绝对路径）
app:
  frontend-public-dir: ${APP_FRONTEND_PUBLIC_DIR}
  frontend-dist-dir: ../frontend/dist
  # 在线编辑配置文件路径（固定为空，由 AdminConfigFileController 按环境探测兜底）
  config-file-path:
  # ── 客户端 IP（地域分布 / 线索）──
  # ClientIpResolver 只取反向代理写入的 X-Real-IP 头；缺失或非法时回退 TCP 直连地址。
  # 部署侧需确保上游代理正确设置 X-Real-IP（本仓库 docker/nginx.conf.d 已设置 X-Real-IP $remote_addr）。
  # IP 归属地解析来源：offline=仅离线 ip2region（默认，零 GEO 配额、无 GEO 外呼）；
  # online=仅在线；auto=在线优先、失败回退离线。ipwho 作为 online 的历史别名仍兼容。
  # 注：本机/内网兜底在所有模式下均可用——仅需一次轻量 IP 回显探出口公网 IP + 离线库定位，不消耗 GEO 配额。
  ip-location-provider: ${IP_LOCATION_PROVIDER:offline}
  # 以下在线 GEO 配置仅在 provider=online/auto 时生效（默认免费 ip-api.com，无需 key）：
  #   {ip} 为查询占位符；查询后端自身出口 IP 时替换为空串（多数 API 空串=查询调用方）。
  #   切换示例——ipapi.co： URL=https://ipapi.co/{ip}/json/ 、省份字段=region 、国家字段=country_name 、状态字段置空。
  ip-location-online-url: "${IP_LOCATION_ONLINE_URL:http://ip-api.com/json/{ip}?lang=zh-CN&fields=status,country,regionName,city}"
  ip-location-country-field: ${IP_LOCATION_COUNTRY_FIELD:country}
  ip-location-province-field: ${IP_LOCATION_PROVINCE_FIELD:regionName}
  ip-location-city-field: ${IP_LOCATION_CITY_FIELD:city}
  ip-location-status-field: ${IP_LOCATION_STATUS_FIELD:status}
  ip-location-status-ok: ${IP_LOCATION_STATUS_OK:success}
  ip-location-timeout-ms: ${IP_LOCATION_TIMEOUT_MS:3000}
  # 私网/回环客户端（本机、内网）无法被 IP 库定位时的归属地兜底，按序尝试（逗号分隔）：
  #   dns   =用“本机运行时自动解析出的 DNS 服务器公网地址”的归属地，纯离线 ip2region 解析、无需外网（默认）；
  #   server=用后端出口公网 IP 的归属地（需外网）；
  #   off   =不兜底（保持空）。
  # 说明：客户端 IP 若能定位（公网）则直接用其归属地，不会走兜底。仅影响归属地 country/province/city；
  # ip_address 仍记录真实客户端地址（本机为 127.0.0.1/内网 IP），不伪造公网 IP。
  ip-location-private-fallback: ${IP_LOCATION_PRIVATE_FALLBACK:dns,server}
  # 探测后端自身出口公网 IP 的服务（纯文本返回 IP），仅 server 兜底时使用；探测失败会自动降级为空。
  public-ip-echo-url: ${PUBLIC_IP_ECHO_URL:https://api.ipify.org}

# 日志配置
logging:
  level:
    com.sinounion: INFO
    org.springframework: INFO
