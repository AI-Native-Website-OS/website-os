server:
  # 监听地址：由 BACKEND_HOST 控制（0.0.0.0=所有网卡）
  address: ${BACKEND_HOST:0.0.0.0}
  port: ${BACKEND_PORT:8080}
  servlet:
    context-path: /api
  # 容器级转发头解析策略：固定 NONE（不信任任何 X-Forwarded-*，防伪造）。
  # 线索 IP 由代码按 app.trust-proxy-ip-header 手动解析，不受此值影响。
  forward-headers-strategy: none

spring:
  application:
    name: ${SPRING_APPLICATION_NAME}
  datasource:
    driver-class-name: org.postgresql.Driver
    # 默认由 PG_* 推导（PG_SERVICE_URL）；特殊场景可用 SPRING_DATASOURCE_* 单独覆盖
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE:sinounion}}
    username: ${SPRING_DATASOURCE_USERNAME:${PG_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PG_PASSWORD}}
    hikari:
      max-lifetime: 600000
      connection-timeout: 30000
      idle-timeout: 300000
      validation-timeout: 5000
      connection-test-query: SELECT 1
      minimum-idle: 5
      maximum-pool-size: 20
  redis:
    # 默认由 REDIS_* 推导（REDIS_SERVICE_URL）；特殊场景可用 SPRING_REDIS_* 单独覆盖
    host: ${SPRING_REDIS_HOST:${REDIS_HOST:localhost}}
    port: ${SPRING_REDIS_PORT:${REDIS_PORT:6379}}
    username: ${SPRING_REDIS_USERNAME:${REDIS_USER:}}
    password: ${SPRING_REDIS_PASSWORD:${REDIS_PASSWORD:}}
    database: ${SPRING_REDIS_DATABASE:${REDIS_DATABASE:0}}
  servlet:
    multipart:
      # 上传大小限制（固定值）
      max-file-size: 8MB
      max-request-size: 8MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sinounion.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  # 有效期固定 24 小时（毫秒）
  expiration: 86400000

# 文件上传配置
upload:
  path: ${UPLOAD_PATH}
  # 允许上传的 MIME 类型（固定值）
  allowed-types: image/png,image/webp,image/gif,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown

# 敏感配置加密（短信 Secret / 模型 API Key 等）：传输用 RSA、落盘用 AES
# CONFIG_CRYPTO_AES_KEY 为 Base64 编码的 32 字节密钥；未配置时启动自动生成并写入 .env
config-crypto:
  aes-key: ${CONFIG_CRYPTO_AES_KEY:}

# SpringDoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# AI服务配置（知识库同步）
ai:
  service:
    # 默认由 PYTHON_HOST/PYTHON_PORT 推导（PYTHON_SERVICE_URL）；特殊场景可用 PYTHON_SERVICE_URL 显式覆盖
    url: ${PYTHON_SERVICE_URL:http://${PYTHON_HOST:localhost}:${PYTHON_PORT:8000}}
    memories-dir: ${AI_SERVICE_MEMORIES_DIR}

# SEO文件路径（相对于工作目录或绝对路径）
app:
  frontend-public-dir: ${APP_FRONTEND_PUBLIC_DIR}
  frontend-dist-dir: ../frontend/dist
  # 在线编辑配置文件路径（固定为空，由 AdminConfigFileController 按环境探测兜底）
  config-file-path:
  # 是否信任反向代理透传的 X-Real-IP / X-Forwarded-For 头（固定 false，防伪造）。
  # 当浏览器直连后端端口（nginx 不透传任何 IP 头）时仅信任 TCP 连接的真实来源 IP。
  trust-proxy-ip-header: false
  # IP 归属地解析来源：offline=仅离线 ip2region；ipwho=仅在线 ipwho.is；auto=在线优先、失败回退离线（默认）。
  ip-location-provider: auto
  ipwho:
    url: https://ipwho.is
    timeout-ms: 3000

# 日志配置
logging:
  level:
    com.sinounion: INFO
    org.springframework: INFO
