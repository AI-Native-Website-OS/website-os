name: sinowebsite
# 统一部署编排（单文件）
# 用法（在 docker/ 目录执行）:
#   ── 生产部署：拉取 GitHub Actions 推送到 GHCR 的镜像 ──
#   docker compose pull && docker compose up -d
#   （先 pull 把 GHCR 镜像拉到本地同名标签，up 发现本地已有即直接启动；
#    务必先 pull，否则本地无镜像时会误走下面的 build 段去编译源码）
#
#   ── 本地从源码构建（调试用，需当前目录有完整项目源码）──
#   docker compose up -d --build                 # 默认用官方源
#   CN_MIRROR=true docker compose up -d --build   # 国内环境加速 npm/pip/maven
#
# 镜像地址默认取自 ghcr.io/<owner>/<repo>，可用环境变量覆盖：
#   REGISTRY  镜像仓库前缀，默认 ghcr.io/ai-native-website-os/website-os
#   TAG       镜像标签，默认 latest（建议在生产中固定为版本/commit sha）
#   CN_MIRROR 本地构建时是否切换国内源，默认 false（CI 不传，保持官方源）

services:
  postgres:
    image: pgvector/pgvector:0.7.0-pg15
    container_name: sino_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sinounion}
      POSTGRES_USER: ${DB_USER:-sinounion}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sinounion}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 首次启动自动建表（幂等脚本，含 pgvector 扩展）
      - ../backend/src/main/resources/sinounion.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sinounion} -d ${DB_NAME:-sinounion}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sino-net]

  redis:
    image: redis:7-alpine
    container_name: sino_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-sinoredis}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sinoredis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sino-net]

  backend:
    image: ${REGISTRY:-ghcr.io/ai-native-website-os/website-os}/backend:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        CN_MIRROR: ${CN_MIRROR:-false}
    container_name: sino_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ↓↓↓ 变量名必须与 backend/src/main/resources/application.yml 占位符一致 ↓↓↓
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: ${SPRING_APPLICATION_NAME:-sinounion-website}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-sinounion}?sslmode=disable
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-sinounion}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-sinounion}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-sinoredis}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # 敏感配置 AES 落盘密钥（必须与 ai 服务一致，否则无法互相解密）
      CONFIG_CRYPTO_AES_KEY: ${CONFIG_CRYPTO_AES_KEY:-}
      # AI 服务地址：application.yml 中 ai.service.url 读取 PYTHON_SERVICE_URL
      PYTHON_SERVICE_URL: http://ai:8000
      AI_SERVICE_MEMORIES_DIR: /app/memories
      # AI 服务内部调用令牌（后端 → AI 服务），务必设置为强随机字符串
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      UPLOAD_PATH: /app/uploads
      APP_FRONTEND_PUBLIC_DIR: /app/frontend-public
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - backend-uploads:/app/uploads
      - backend-public:/app/frontend-public
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8080"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks: [sino-net]

  ai:
    image: ${REGISTRY:-ghcr.io/ai-native-website-os/website-os}/ai:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/ai.Dockerfile
      args:
        CN_MIRROR: ${CN_MIRROR:-false}
    container_name: sino_ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ↓↓↓ 变量名必须与 AI_consultant 中 db.py / main.py / auth.py 读取的键一致 ↓↓↓
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${DB_NAME:-sinounion}
      PG_USER: ${DB_USER:-sinounion}
      PG_PASSWORD: ${DB_PASSWORD:-sinounion}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USER: ${REDIS_USER:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-sinoredis}
      REDIS_DATABASE: 0
      PYTHON_HOST: 0.0.0.0
      PYTHON_PORT: 8000
      # AI 服务管理/破坏性接口鉴权：浏览器管理端校验 JWT（需与后端共享 JWT_SECRET），
      # 服务间调用校验内部令牌
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      # 敏感配置 AES 落盘密钥（必须与后端一致，否则无法解密后端写入的 enc:v1: 密文）
      CONFIG_CRYPTO_AES_KEY: ${CONFIG_CRYPTO_AES_KEY:-}
      UPLOAD_PATH: /app/uploads
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LANG: C.UTF-8
      # ↓↓↓ LLM / 向量模型配置：作为启动兜底默认值（AI_consultant/main.py 读取）；
      # 生产环境建议在管理后台「模型参数配置」中维护并写库，见 docker/.env.example ↓↓↓
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      VL_BASE_URL: ${VL_BASE_URL:-}
      VL_API_KEY: ${VL_API_KEY:-}
      VL_MODEL: ${VL_MODEL:-}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
    volumes:
      - ai-memories:/app/memories
      - ai-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',8000),2); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks: [sino-net]

  frontend:
    image: ${REGISTRY:-ghcr.io/ai-native-website-os/website-os}/frontend:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        CN_MIRROR: ${CN_MIRROR:-false}
    container_name: sino_frontend
    restart: unless-stopped
    depends_on:
      - backend
      - ai
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks: [sino-net]

volumes:
  postgres-data:
  redis-data:
  backend-uploads:
  backend-public:
  ai-memories:
  ai-uploads:

networks:
  sino-net:
    driver: bridge
