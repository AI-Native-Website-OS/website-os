name: sinowebsite
# 统一部署编排（单文件）
# 用法（在 docker/ 目录执行）:
#   ── 生产部署：拉取 GitHub Actions 推送到 GHCR 的镜像 ──
#   docker compose pull && docker compose up -d
#   （先 pull 把 GHCR 镜像拉到本地同名标签，up 发现本地已有即直接启动；
#    务必先 pull，否则本地无镜像时会误走下面的 build 段去编译源码）
#
#   ── 本地从源码构建（调试用，需当前目录有完整项目源码）──
#   docker compose up -d --build                 # 默认用官方源
#   CN_MIRROR=true docker compose up -d --build   # 国内环境加速 npm/pip/maven
#
# 镜像地址默认取自 ghcr.io/<owner>/<repo>，可用环境变量覆盖：
#   REGISTRY  镜像仓库前缀，默认 ghcr.io/ai-native-website-os/website-os
#   TAG       镜像标签，默认 latest（建议在生产中固定为版本/commit sha）
#   CN_MIRROR 本地构建时是否切换国内源，默认 false（CI 不传，保持官方源）

services:
  sino-website-postgresql:
    image: pgvector/pgvector:pg18
    container_name: sino-website-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sinounion}
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sinounion}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../backend/src/main/resources/sinounion.sql:/docker-entrypoint-initdb.d/sinounion.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sinounion} -d ${DB_NAME:-sinounion}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sino-website]

  sino-website-redis:
    image: redis:8.8.0
    container_name: sino-website-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-sinoredis}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sinoredis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sino-website]

  sino-website-backend:
    image: ${REGISTRY:-ghcr.io/ai-native-website-os/website-os}/backend:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        CN_MIRROR: ${CN_MIRROR:-false}
    container_name: sino-website-backend
    restart: unless-stopped
    depends_on:
      sino-website-postgresql:
        condition: service_healthy
      sino-website-redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    volumes:
      - uploads:/app/uploads
      - memories:/app/AI_consultant/memories
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8080"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks: [sino-website]

  sino-website-ai:
    image: ${REGISTRY:-ghcr.io/ai-native-website-os/website-os}/ai:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/ai.Dockerfile
      args:
        CN_MIRROR: ${CN_MIRROR:-false}
    container_name: sino-website-ai
    restart: unless-stopped
    depends_on:
      sino-website-postgresql:
        condition: service_healthy
      sino-website-redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    volumes:
      - memories:/app/AI_consultant/memories
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',8000),2); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks: [sino-website]

  sino-website-frontend:
    image: ${REGISTRY:-ghcr.io/ai-native-website-os/website-os}/frontend:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        CN_MIRROR: ${CN_MIRROR:-false}
    container_name: sino-website-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${FRONTEND_PORT:-3200}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks: [sino-website]

volumes:
  postgres-data:
  redis-data:
  memories:
  uploads:

networks:
  sino-website:
    driver: bridge
