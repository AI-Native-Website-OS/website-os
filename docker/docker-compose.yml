version: '3.8'
name: sinowebsite

services:
  sino-website-postgresql:
    image: pgvector/pgvector:pg18
    container_name: sino-website-postgresql
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: Root@123
      POSTGRES_DB: sinounion
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./docker/data/postgres-data:/var/lib/postgresql/pgdata
      - ./backend/src/main/resources/sinounion.sql:/docker-entrypoint-initdb.d/sinounion.sql:ro
    networks:
      - sino-website
  sino-website-redis:
    image: redis:8.8.0
    container_name: sino-website-redis
    restart: always
    command: redis-server --requirepass sinodata
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - ./docker/data/redis-data:/data
    networks:
      - sino-website
  sino-website-python:
    image: sino-website-python:latest
    container_name: sino-website-python
    restart: always
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Shanghai
      # 容器内必须监听所有网卡，容器间通过服务名访问
      PYTHON_HOST: 0.0.0.0
      PYTHON_PORT: 8000
    volumes:
      - ./data/app:/app
      - ./.env:/app/.env:ro
    networks:
      - sino-website
  sino-website-backend:
    image: sino-website-backend:latest
    container_name: sino-website-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      # 后端监听：容器内必须监听所有网卡
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8080
      # 容器间互通：通过 compose 服务名访问，而非 .env 中的 localhost
      PYTHON_HOST: sino-website-python
      PYTHON_PORT: 8000
      PG_HOST: sino-website-postgresql
      PG_PORT: 5432
      REDIS_HOST: sino-website-redis
      REDIS_PORT: 6379
    volumes:
      - ./data/app:/app
      - ./.env:/app/.env:ro
    networks:
      - sino-website
  sino-website-frontend:
    image: nginx:latest
    container_name: sino-website-frontend
    restart: always
    ports:
      - "80:80"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./nginx.conf.d:/etc/nginx/conf.d
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - sino-website
networks:
  sino-website:
